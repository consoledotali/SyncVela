services:
  postgres:
    image: postgres:15-alpine
    container_name: syncvela-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: syncvela
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - syncvela-network

  redis:
    image: redis:7-alpine
    container_name: syncvela-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - syncvela-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: syncvela-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-syncvela_local_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SyncVelaMinIO!2026Local}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - syncvela-network

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: syncvela-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-syncvela_local_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SyncVelaMinIO!2026Local}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/syncvela-attachments
        mc mb --ignore-existing local/syncvela-avatars
        cat > /tmp/syncvela-cors.xml <<'EOF'
        <CORSConfiguration>
          <CORSRule>
            <AllowedOrigin>http://localhost:3000</AllowedOrigin>
            <AllowedMethod>GET</AllowedMethod>
            <AllowedMethod>PUT</AllowedMethod>
            <AllowedMethod>HEAD</AllowedMethod>
            <AllowedHeader>*</AllowedHeader>
            <ExposeHeader>ETag</ExposeHeader>
            <MaxAgeSeconds>3600</MaxAgeSeconds>
          </CORSRule>
        </CORSConfiguration>
        EOF
        mc cors set local/syncvela-attachments /tmp/syncvela-cors.xml
        mc cors set local/syncvela-avatars /tmp/syncvela-cors.xml
        mc anonymous set download local/syncvela-avatars
    networks:
      - syncvela-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  syncvela-network:
    driver: bridge
